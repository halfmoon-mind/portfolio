<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="32" height="32" fill="#2D3748"/>
  
  <!-- 고양이 귀 -->
  <rect x="6" y="6" width="4" height="4" fill="#FF8C42"/>
  <rect x="22" y="6" width="4" height="4" fill="#FF8C42"/>
  <rect x="7" y="7" width="2" height="2" fill="#FF6B1A"/>
  <rect x="23" y="7" width="2" height="2" fill="#FF6B1A"/>
  
  <!-- 고양이 머리 -->
  <rect x="8" y="10" width="16" height="12" fill="#FF8C42"/>
  <rect x="6" y="12" width="2" height="8" fill="#FF8C42"/>
  <rect x="24" y="12" width="2" height="8" fill="#FF8C42"/>
  
  <!-- 고양이 얼굴 하이라이트 -->
  <rect x="10" y="12" width="12" height="8" fill="#FFAD70"/>
  
  <!-- 눈 -->
  <rect x="12" y="14" width="2" height="2" fill="#000000"/>
  <rect x="18" y="14" width="2" height="2" fill="#000000"/>
  
  <!-- 코 -->
  <rect x="15" y="17" width="2" height="1" fill="#000000"/>
  
  <!-- 입 -->
  <rect x="14" y="18" width="1" height="1" fill="#000000"/>
  <rect x="17" y="18" width="1" height="1" fill="#000000"/>
  
  <!-- 개발 기호 </> - 픽셀 스타일로 단순화 -->
  <!-- < -->
  <rect x="9" y="15" width="1" height="1" fill="#61DAFB"/>
  <rect x="8" y="16" width="1" height="1" fill="#61DAFB"/>
  <rect x="9" y="17" width="1" height="1" fill="#61DAFB"/>
  
  <!-- / -->
  <rect x="15" y="15" width="1" height="1" fill="#61DAFB"/>
  <rect x="16" y="16" width="1" height="1" fill="#61DAFB"/>
  
  <!-- > -->
  <rect x="22" y="15" width="1" height="1" fill="#61DAFB"/>
  <rect x="23" y="16" width="1" height="1" fill="#61DAFB"/>
  <rect x="22" y="17" width="1" height="1" fill="#61DAFB"/>
  
  <!-- 고양이 몸통 -->
  <rect x="10" y="22" width="12" height="6" fill="#FF8C42"/>
  <rect x="12" y="23" width="8" height="4" fill="#FFAD70"/>
  
  <!-- 발 -->
  <rect x="10" y="28" width="3" height="2" fill="#FF8C42"/>
  <rect x="19" y="28" width="3" height="2" fill="#FF8C42"/>
</svg>